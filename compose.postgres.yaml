services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: commerce
      POSTGRES_DB: commerce
      POSTGRES_PASSWORD: ${COMMERCE_PG_PASSWORD:?Set COMMERCE_PG_PASSWORD for local PostgreSQL}
    ports:
      - "127.0.0.1:${COMMERCE_PG_PORT:-5432}:5432"
    volumes:
      - commerce_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  commerce_pg_data:
